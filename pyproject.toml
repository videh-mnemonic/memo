[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-agent"
dynamic = ["version"]
description = "Record, transport, and replay directory sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.35",
    "pathspec>=0.12.1",
    "watchdog>=6.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memo = "memo.cli:main"
memo-daemon = "memo.daemon.server:main"

[tool.setuptools.packages.find]
include = ["memo*"]

[tool.setuptools.dynamic]
version = {attr = "memo.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
