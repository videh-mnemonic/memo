[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-agent"
version = "0.1.0"
description = "Capture, ship, reconstruct, and replay coding-agent sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.35",
    "pathspec>=0.12.1",
    "watchdog>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memo = "memo.cli:main"
memo-daemon = "memo.daemon:main"

[tool.setuptools.packages.find]
include = ["memo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
