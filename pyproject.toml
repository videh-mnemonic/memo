[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-agent"
dynamic = ["version"]
description = "Record, transport, and replay directory sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "minio>=7.2",
    "pathspec>=0.12.1",
    "watchdog>=6.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[project.scripts]
memo = "memo.cli:main"
memo-daemon = "memo.daemon.server:main"

[tool.setuptools.packages.find]
include = ["memo*"]

[tool.setuptools.dynamic]
version = {attr = "memo.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
