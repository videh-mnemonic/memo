[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-legacy-migrator"
version = "1.0.0"
description = "One-time migration utility for pre-daemon Memo recordings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "memo-agent==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
memo-migrate-legacy = "memo_legacy_migrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
