name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -e ./legacy-migrator
      - run: ruff check memo tests legacy-migrator/src legacy-migrator/tests
      - run: ruff format --check memo tests legacy-migrator/src legacy-migrator/tests
      - run: pytest
      - run: pytest legacy-migrator/tests
